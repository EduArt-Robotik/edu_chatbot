# Silero VAD node parameters
/**:
  silero_vad_node:
    ros__parameters:
      enabled: false
      use_wakeword_trigger: true
      wakeword_topic: "/wakeword/trigger"
      wakeword_recording_timeout_sec: 6.0
      model_repo: "mgonzs13/silero-vad-onnx"
      model_filename: "silero_vad.onnx"
      model_path: ""
      sample_rate: 16000
      frame_size_ms: 32
      threshold: 0.5
      min_silence_ms: 1048
      speech_pad_ms: 32
      use_cuda: false

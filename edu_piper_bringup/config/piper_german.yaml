# Piper node parameters
# As a warning: The german piper voices all sound terrible
/**:
  piper_node:
    ros__parameters:
      chunk: 512
      frame_id: ""

      # Model parameters
      model:
        repo: "rhasspy/piper-voices"
        filename: "de/de_DE/karlsson/low/de_DE-karlsson-low.onnx"
        path: ""
        config_repo: "rhasspy/piper-voices"
        config_filename: "de/de_DE/karlsson/low/de_DE-karlsson-low.onnx.json"
        config_path: ""

      # Synthesis parameters
      synthesis:
        speaker_id: 0
        noise_scale: 0.667
        length_scale: 1.0
        noise_w_scale: 0.8
        sentence_silence_seconds: 0.2

services:
  edu-chatbot-llm:
    image: edu_ollama:latest
    build:
      context: ./ollama
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - llm-models:/root/.ollama
    environment:
      IS_PERSISTENT: "TRUE"
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_KEEP_ALIVE: "-1" # Keeps the models loaded in memory. Prevents unloading after a timeout.
      OLLAMA_IGPU_ENABLE: "1"
      OLLAMA_MAX_LOADED_MODELS: "2"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  edu-chatbot-llm-update:
    image: edu_ollama:latest
    build:
      context: ./ollama
      dockerfile: ./Dockerfile
    restart: unless-stopped
    profiles:
      - update
    environment:
      OLLAMA_HOST: "http://edu-chatbot-llm:11434"
    volumes:
      - ./ollama/models.txt:/models.txt:ro
      - ./ollama/update_models.sh:/update_models.sh:ro
    entrypoint: ["/bin/bash", "/update_models.sh"]
    depends_on:
      edu-chatbot-llm:
        condition: service_healthy

  edu-chatbot-database:
    image: edu_chroma:latest
    build:
      context: ./chroma
      dockerfile: ./Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - database-core:/data
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 60s

  edu-chatbot-database-update:
    build:
      context: ./
      dockerfile: ./edu_chatbot_rag/docker/Dockerfile
    image: edu_chatbot_rag:latest
    restart: "no"
    profiles:
      - update
    environment:
      - CHROMA_HOST=edu-chatbot-database
      - CHROMA_PORT=8000
      - OLLAMA_HOST=http://edu-chatbot-llm:11434
      - INGESTION_CACHE_PATH=/home/user/data
    volumes:
      - ./database:/home/user/database
      - database-cache:/home/user/data
    command: ["ros2", "run", "edu_chatbot_rag", "edu_chatbot_database_update_node", "--ros-args", "-p", "wipe_database:=false", "--ros-args", "--log-level", "info"]
    depends_on:
      edu-chatbot-llm:
        condition: service_healthy
      edu-chatbot-database:
        condition: service_healthy

  edu-chatbot-rag:
    build:
      context: ./
      dockerfile: ./edu_chatbot_rag/docker/Dockerfile
    image: edu_chatbot_rag:latest
    restart: unless-stopped
    profiles:
      - chatbot
    network_mode: host
    environment:
      - CHROMA_HOST=localhost
      - CHROMA_PORT=8000
      - OLLAMA_HOST=http://localhost:11434
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/ros/jazzy/fastdds_no_shm.xml
    volumes:
      - ./docker/fastdds_no_shm.xml:/opt/ros/jazzy/fastdds_no_shm.xml:ro
    command: ["ros2", "run", "edu_chatbot_rag", "edu_chatbot_rag_node", "--ros-args", "-p", "model:=llama3.2:3b", "-p", "top_k:=5", "-p", "warm_up_pipeline:=true", "-p", "temperature:=0.0", "--ros-args", "--log-level", "debug"]
    stdin_open: true
    tty: true
    depends_on:
      edu-chatbot-llm:
        condition: service_healthy
      edu-chatbot-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/jazzy/setup.bash && ros2 action info /rag/query 2>/dev/null | grep -q \"Action servers: [1-9]\"'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 300s

  edu-chatbot-stt:
    build:
      context: .
      dockerfile: ./edu_whisper_bringup/Dockerfile
    image: whisper_ros:latest
    restart: unless-stopped
    profiles:
      - chatbot
    network_mode: host
    privileged: true
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - whisper_ros:/root/.cache/huggingface/
      - ./docker/fastdds_no_shm.xml:/opt/ros/jazzy/fastdds_no_shm.xml:ro
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/ros/jazzy/fastdds_no_shm.xml
    command: [ 
      "/bin/bash",
      "-c",
      "source /opt/ros/jazzy/setup.bash && \
       source /root/ros2_ws/install/setup.bash && \
       ros2 launch edu_whisper_bringup whisper.launch.py"
    ]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/jazzy/setup.bash && ros2 action info /whisper/listen 2>/dev/null | grep -q \"Action servers: [1-9]\"'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 300s

  edu-chatbot-tts:
    build:
      context: .
      dockerfile: ./edu_piper_bringup/Dockerfile
    image: piper_ros:latest
    restart: unless-stopped
    profiles:
      - chatbot
    network_mode: host
    privileged: true
    devices:
      - /dev/snd:/dev/snd
    volumes:
      - piper_ros:/root/.cache/huggingface/
      - ./docker/fastdds_no_shm.xml:/opt/ros/jazzy/fastdds_no_shm.xml:ro
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/ros/jazzy/fastdds_no_shm.xml
    command: [ 
      "/bin/bash",
      "-c",
      "source /opt/ros/jazzy/setup.bash && \
      source /root/ros2_ws/install/setup.bash && \
      ros2 launch edu_piper_bringup piper.launch.py"
    ]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'source /opt/ros/jazzy/setup.bash && ros2 action info /piper/say 2>/dev/null | grep -q \"Action servers: [1-9]\"'"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 300s

  edu-chatbot-controller:
    build:
      context: ./
      dockerfile: ./edu_chatbot_controller/docker/Dockerfile
    image: edu_chatbot_controller:latest
    restart: unless-stopped
    profiles:
      - chatbot
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID}
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/ros/jazzy/fastdds_no_shm.xml
    volumes:
      - ./docker/fastdds_no_shm.xml:/opt/ros/jazzy/fastdds_no_shm.xml:ro
    command: ["ros2", "run", "edu_chatbot_controller", "edu_chatbot_pib_controller_node", "--ros-args", "--log-level", "info"]
    depends_on:
      edu-chatbot-rag:
        condition: service_healthy
      edu-chatbot-stt:
        condition: service_healthy
      edu-chatbot-tts:
        condition: service_healthy

  edu-chatbot-webui:
    image: ghcr.io/open-webui/open-webui:main
    restart: unless-stopped
    ports:
      - "3000:8080"
    profiles:
      - tools
    environment:
      WEBUI_AUTH: "FALSE"
      OLLAMA_BASE_URL: http://edu-chatbot-llm:11434
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      edu-chatbot-llm:
        condition: service_healthy

volumes:
  open-webui:
  llm-models:
  database-core:
  database-cache:
  whisper_ros:
  piper_ros:
  
networks:
  default:
    name: edu_chatbot_network